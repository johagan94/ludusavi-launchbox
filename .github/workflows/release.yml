name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    env:
      # Mapped from a secret so steps can be gated with `if: env.TS_ACCOUNT != ''`.
      # (Secrets cannot be referenced directly in a step's `if:` condition.)
      # When the signing secrets are absent, the signing steps are skipped and
      # the workflow still publishes a working, unsigned installer.
      TS_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build src/LudusaviLaunchBox.csproj -c Release

      - name: Azure login (signing only)
        if: env.TS_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLL with Azure Trusted Signing
        if: env.TS_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: src/bin/Release/net9.0-windows
          files-folder-filter: dll
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/LudusaviLaunchBox.iss

      - name: Sign installer with Azure Trusted Signing
        if: env.TS_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: artifacts/installer
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LudusaviLaunchBox-${{ steps.ver.outputs.version }}
          path: |
            src/bin/Release/net9.0-windows/LudusaviLaunchBox.dll
            artifacts/installer/LudusaviLaunchBox-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/bin/Release/net9.0-windows/LudusaviLaunchBox.dll
            artifacts/installer/LudusaviLaunchBox-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
